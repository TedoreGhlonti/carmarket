<!--templates/registration/login.html-->
{% extends 'base.html' %}
{% load crispy_forms_tags %}
{% block title %}Login - Carmarket{% endblock title %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card shadow-sm">
            <div class="card-body p-4">
                <h2 class="text-center mb-1">შესვლა</h2>
                <p class="text-center text-muted mb-4">კეთილი იყოს შენი დაბრუნება CarMarket-ზე</p>

                <form method="post">
                    {% csrf_token %}
                    {{ form|crispy }}
                    <button class="btn btn-primary w-100 mt-3" type="submit">შესვლა</button>
                </form>

                <p class="text-center mt-3 mb-0">
                    არ გაქვს ანგარიში?
                    <a href="{% url 'signup' %}">დარეგისტრირდი</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock content %}
